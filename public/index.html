<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Produtos Pet</title>
<style>
  body { font-family: Arial, sans-serif; max-width: 700px; margin: 40px auto; padding: 0 16px; }
  h1 { font-size: 22px; }
  h2 { font-size: 16px; margin-top: 32px; }
  input { padding: 6px; margin-right: 8px; }
  button { padding: 6px 12px; cursor: pointer; }
  table { width: 100%; border-collapse: collapse; margin-top: 12px; }
  th, td { text-align: left; padding: 8px; border-bottom: 1px solid #ddd; }
  .erro { color: #c0392b; margin-top: 8px; }
  .form-linha { margin-top: 8px; }
</style>
</head>
<body>

<h1>Produtos Pet</h1>

<h2>Buscar produtos</h2>
<div class="form-linha">
  <input type="text" id="busca-nome" placeholder="Nome do produto (opcional)">
  <button onclick="buscarProdutos()">Buscar</button>
  <button onclick="listarTodos()">Listar todos</button>
</div>

<table>
  <thead>
    <tr><th>ID</th><th>Nome</th><th>Categoria</th><th>Preço</th><th></th></tr>
  </thead>
  <tbody id="tabela-produtos"></tbody>
</table>

<h2>Adicionar produto</h2>
<div class="form-linha">
  <input type="text" id="novo-nome" placeholder="Nome">
  <input type="text" id="novo-categoria" placeholder="Categoria">
  <input type="number" id="novo-preco" placeholder="Preço" step="0.01">
  <button onclick="adicionarProduto()">Adicionar</button>
</div>

<p class="erro" id="mensagem-erro"></p>

<script>
async function listarTodos() {
  const resposta = await fetch('/api/produtos');
  const produtos = await resposta.json();
  renderizarTabela(produtos);
}

async function buscarProdutos() {
  const nome = document.getElementById('busca-nome').value;
  const url = nome ? `/api/produtos?nome=${encodeURIComponent(nome)}` : '/api/produtos';
  const resposta = await fetch(url);
  const produtos = await resposta.json();
  renderizarTabela(produtos);
}

async function adicionarProduto() {
  const nome = document.getElementById('novo-nome').value;
  const categoria = document.getElementById('novo-categoria').value;
  const preco = parseFloat(document.getElementById('novo-preco').value);

  const resposta = await fetch('/api/produtos', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ nome, categoria, preco }),
  });

  const dados = await resposta.json();

  if (!resposta.ok) {
    mostrarErro(dados.erro);
    return;
  }

  document.getElementById('novo-nome').value = '';
  document.getElementById('novo-categoria').value = '';
  document.getElementById('novo-preco').value = '';
  limparErro();
  listarTodos();
}

async function removerProduto(id) {
  const resposta = await fetch(`/api/produtos/${id}`, { method: 'DELETE' });

  if (!resposta.ok && resposta.status !== 204) {
    const dados = await resposta.json();
    mostrarErro(dados.erro);
    return;
  }

  listarTodos();
}

function renderizarTabela(produtos) {
  const corpo = document.getElementById('tabela-produtos');
  corpo.innerHTML = '';

  produtos.forEach((p) => {
    const linha = document.createElement('tr');
    linha.innerHTML = `
      <td>${p.id}</td>
      <td>${p.nome}</td>
      <td>${p.categoria}</td>
      <td>R$ ${p.preco.toFixed(2)}</td>
      <td><button onclick="removerProduto(${p.id})">Remover</button></td>
    `;
    corpo.appendChild(linha);
  });
}

function mostrarErro(texto) {
  document.getElementById('mensagem-erro').textContent = texto;
}

function limparErro() {
  document.getElementById('mensagem-erro').textContent = '';
}

listarTodos();
</script>

</body>
</html>
